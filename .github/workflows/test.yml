# Every test, the head-unit builds and the reproducibility check.
name: Test

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # release.js check: SOURCE_DATE_EPOCH comes from each component's last commit
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0

      # the head-unit builds and test-x86 run in Docker, preinstalled on the runner
      - run: make -C native/cluster-render test
      - run: make -C native/cluster-render test-x86 target
      - run: make -C native/waze-on-cluster test
      - run: make -C native/waze-on-cluster test-x86 target
      - run: node apps/robertn_waze_cluster/tools/test_control.js
      - run: node native/hud-startup-diagnostics/test.js
      - run: node apps/robertn_waze_cluster/tools/test_trace.js
      - run: node native/cluster-studio/test/test.js
      - run: node apps/robertn_waze_cluster/tools/test_studio.js
      - run: node apps/robertn_waze_cluster/tools/test_design.js
      - run: sh apps/robertn_waze_cluster/tools/test_startup_node8.sh
      - run: node apps/robertn_waze_cluster/tools/test_page.js
      - run: node apps/robertn_waze_cluster/tools/test_profiles.js
      - run: node apps/robertn_waze_cluster/tools/test_settings.js
      - run: node native/waze-on-cluster/startup/test/controller.test.js
      - run: node native/waze-on-cluster/startup/test/service.test.js
      - run: node release/test/release_test.js
      - run: node release/release.js check
