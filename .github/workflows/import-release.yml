name: Import and publish HUD diagnostics
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.12.0
      - name: Import the reviewed source commit
        run: |
          if [ -f release-import.bundle ]; then
            echo '5d191a18062571576debbda3382ac5b33f580e7b90fe8e5d03e224d8b3bce83e  release-import.bundle' | sha256sum -c -
            git bundle verify release-import.bundle
            git fetch ./release-import.bundle refs/heads/shamo/hud-settings-research:refs/remotes/import/release
            test "$(git rev-parse refs/remotes/import/release)" = '0ba09a488f93c9ab0f6177173d699591b53a7d2b'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-ff --no-edit refs/remotes/import/release
            git rm release-import.bundle
            git commit -m 'Remove source transport bundle after verified import'
            git push origin HEAD:main
          fi
          git merge-base --is-ancestor 0ba09a488f93c9ab0f6177173d699591b53a7d2b HEAD
      - run: node native/hud-startup-diagnostics/test.js
      - name: Check the collector with Node 8 on Linux
        run: |
          set -eu
          runtime_dir=$(mktemp -d)
          trap 'rm -rf "$runtime_dir"' EXIT
          curl --fail --silent --show-error --location --max-time 90 https://nodejs.org/download/release/v8.17.0/node-v8.17.0-linux-x64.tar.gz -o "$runtime_dir/node.tar.gz"
          printf '%s  %s\n' 8b2c9e1f84317c4b02736c4c50db4dd2cd6c4f0ba910fa81f887c8c9294af596 "$runtime_dir/node.tar.gz" | sha256sum -c -
          tar -xzf "$runtime_dir/node.tar.gz" -C "$runtime_dir"
          "$runtime_dir/node-v8.17.0-linux-x64/bin/node" native/hud-startup-diagnostics/test.js
      - run: node release/test/release_test.js
      - run: node release/release.js check hud-startup-diagnostics
      - name: Publish diagnostics only and preserve existing app artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
          MGU_PUBLISH_VISIBILITY: any
        run: node release/release.js publish hud-startup-diagnostics
