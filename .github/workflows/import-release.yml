name: Import and publish blank-map recovery
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.12.0
      - name: Import tested blank-map recovery source
        run: |
          set -eu
          if [ -f release-import.bundle ]; then
            echo '89926c19c23dd8f92b7f4170d0cafa4e0b51180a3630d2c7571e7e7d726e521a  release-import.bundle' | sha256sum -c -
            git bundle verify release-import.bundle
            git fetch ./release-import.bundle refs/heads/shamo/hud-content-ready:refs/remotes/import/release
            test "$(git rev-parse refs/remotes/import/release)" = 'cb947121e71d0d4e42bad3d93abdaa16e34d9b5f'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-ff --no-edit refs/remotes/import/release
            git rm release-import.bundle
            git commit -m 'Remove tested blank-map source transport bundle'
            git push origin HEAD:main
          fi
          git merge-base --is-ancestor cb947121e71d0d4e42bad3d93abdaa16e34d9b5f HEAD
      - name: Test app controls and saved gauge behavior
        run: |
          set -eu
          for test in apps/robertn_waze_cluster/tools/test_*.js; do
            node "$test"
          done
          for test in test test_telemetry test_stability test_recovery test_polling test_frame_cache test_refresh test_panel_composition test_image_delta test_assistance live_values_test test_phone_design test_features; do
            node "native/cluster-studio/test/$test.js"
          done
      - name: Test renderer and map lifecycle
        run: |
          set -eu
          make -C native/cluster-render test
          make -C native/waze-on-cluster test
          node native/cluster-studio/test/test_renderer_integration.js
          node release/test/release_test.js
      - name: Test x86 paths and build for head-unit ABI
        run: make -C native/waze-on-cluster test-x86 target
      - name: Verify reproducible map-tool artifacts
        run: node release/release.js check waze-on-cluster
      - name: Publish map tool 0.7.116
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
          MGU_PUBLISH_VISIBILITY: any
        run: node release/release.js publish waze-on-cluster
