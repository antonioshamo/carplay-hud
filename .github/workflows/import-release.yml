name: Verify and publish HUD profile coordination
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.12.0
      - name: Import tested recovery source
        run: |
          set -eu
          if [ -f bmw-conflict-0142.bundle ]; then
            echo '63d7103314bcd24412ee0e9b2ae13ad57edc225a6067f5055086fd9a66806f78  bmw-conflict-0142.bundle' | sha256sum -c -
            git bundle verify bmw-conflict-0142.bundle
            git fetch ./bmw-conflict-0142.bundle refs/heads/shamo/native-assistance-window:refs/remotes/import/recovery
            test "$(git rev-parse refs/remotes/import/recovery)" = '4667c8dbc96823f0fd8bbcdc89fbd3c784ce2fab'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-ff --no-edit refs/remotes/import/recovery
            git rm bmw-conflict-0142.bundle
            git commit -m 'Remove tested profile coordination source transport bundle'
            git push origin HEAD:main
          fi
          git merge-base --is-ancestor 4667c8dbc96823f0fd8bbcdc89fbd3c784ce2fab HEAD
      - name: Verify renderer host integration
        run: make -C native/cluster-render test
      - name: Verify map tool integration
        run: |
          make -C native/waze-on-cluster test
      - name: Verify app, helper and factory preview
        run: |
          set -eu
          for test in native/cluster-studio/test/*.js apps/robertn_waze_cluster/tools/test_*.js; do
            node "$test"
          done
          node native/cluster-studio/test/factory-personal/test.js
          node native/cluster-studio/test/assistance-window/test.js
          sh apps/robertn_waze_cluster/tools/test_startup_node8.sh
          node release/test/release_test.js
      - name: Verify reproducible app artifact
        run: node release/release.js check robertn_waze_cluster
      - name: Publish CarPlay HUD 0.4.142
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
          MGU_PUBLISH_VISIBILITY: any
        run: node release/release.js publish robertn_waze_cluster
