name: Import and publish gauge widgets and refresh
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.12.0
      - name: Import tested widget, refresh and call recovery source
        run: |
          if [ -f release-import.bundle ]; then
            echo '97c95b59713cec33fd874eebab36e03207547536cf7e8f193ffc93ec39ac41ea  release-import.bundle' | sha256sum -c -
            git bundle verify release-import.bundle
            git fetch ./release-import.bundle refs/heads/shamo/call-recovery:refs/remotes/import/release
            test "$(git rev-parse refs/remotes/import/release)" = 'ab82ac4c25757eedd9070085aa236bfa98367098'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-ff --no-edit refs/remotes/import/release
            git rm release-import.bundle
            git commit -m 'Remove tested recovery source transport bundle'
            git push origin HEAD:main
          fi
          git merge-base --is-ancestor ab82ac4c25757eedd9070085aa236bfa98367098 HEAD
      - name: Test all app controls, editing and startup
        run: |
          set -eu
          for test in apps/robertn_waze_cluster/tools/test_*.js; do
            node "$test"
          done
      - name: Test gauge continuity, data and visual parity
        run: |
          set -eu
          for test in test test_telemetry test_stability test_polling test_frame_cache test_refresh test_panel_composition test_image_delta test_assistance live_values_test test_phone_design test_features; do
            node "native/cluster-studio/test/$test.js"
          done
          make -C native/cluster-render test
          make -C native/cluster-render test-x86 target
          node release/test/release_test.js
      - name: Test new runtime paths on Node 8
        run: |
          set -eu
          runtime_dir=$(mktemp -d)
          trap 'rm -rf "$runtime_dir"' EXIT
          curl --fail --silent --show-error --location --max-time 90 https://nodejs.org/download/release/v8.16.2/node-v8.16.2-linux-x64.tar.gz -o "$runtime_dir/node.tar.gz"
          printf '%s  %s\n' 722d07291a8886384388c6795a747ec2055073f83dc73c0a97efba0022cc23ff "$runtime_dir/node.tar.gz" | sha256sum -c -
          tar -xzf "$runtime_dir/node.tar.gz" -C "$runtime_dir"
          for test in test_stability test_polling test_frame_cache test_refresh test_telemetry test_image_delta; do
            "$runtime_dir/node-v8.16.2-linux-x64/bin/node" "native/cluster-studio/test/$test.js"
          done
          for test in test_startup test_settings_startup test_design_lifecycle test_customization test_editor_live test_idrive test_canvas_line; do
            "$runtime_dir/node-v8.16.2-linux-x64/bin/node" "apps/robertn_waze_cluster/tools/$test.js"
          done
      - name: Verify reproducible app and helper artifacts
        run: node release/release.js check cluster-render cluster-studio robertn_waze_cluster
      - name: Publish app 0.4.137, helper 0.1.14 and renderer 0.3.103
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
          MGU_PUBLISH_VISIBILITY: any
        run: node release/release.js publish cluster-render cluster-studio robertn_waze_cluster
