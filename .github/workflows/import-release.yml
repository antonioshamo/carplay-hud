name: Import and publish verified CarPlay startup
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.12.0
      - name: Import verified startup source
        run: |
          if [ -f release-import.bundle ]; then
            echo 'ce3f1119dd0404efd95cf8b32077a3e8bb4802a3ed427c0536fc1daf69d75498  release-import.bundle' | sha256sum -c -
            git bundle verify release-import.bundle
            git fetch ./release-import.bundle refs/heads/shamo/carplay-map-startup:refs/remotes/import/release
            test "$(git rev-parse refs/remotes/import/release)" = '518f968d897ff6284ab347e219b51357216106e7'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-ff --no-edit refs/remotes/import/release
            git rm release-import.bundle
            git commit -m 'Remove verified startup source transport bundle'
            git push origin HEAD:main
          fi
          git merge-base --is-ancestor 518f968d897ff6284ab347e219b51357216106e7 HEAD
      - name: Verify startup modules and recovery
        run: |
          node native/waze-on-cluster/patch/test/map_startup_test.js
          node native/waze-on-cluster/patch/test/startup_trial_test.js
          node native/waze-on-cluster/patch/test/recovery_test.js
          node native/waze-on-cluster/startup/test/controller.test.js
          node native/waze-on-cluster/startup/test/service.test.js
          node release/test/release_test.js
      - name: Verify reproducible tool artifact
        run: node release/release.js check waze-on-cluster
      - name: Publish verified map-only startup 0.7.115
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
          MGU_PUBLISH_VISIBILITY: any
        run: node release/release.js publish waze-on-cluster
