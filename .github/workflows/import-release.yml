name: Import and publish HUD trial
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.12.0
      - name: Import the reviewed source commit
        run: |
          if [ -f release-import.bundle ]; then
            echo '368a4521ca4ee265e564b5e3db28ee16c2e535f4acc2dd1089227d23976e69da  release-import.bundle' | sha256sum -c -
            git bundle verify release-import.bundle
            git fetch ./release-import.bundle refs/heads/shamo/hud-settings-research:refs/remotes/import/release
            test "$(git rev-parse refs/remotes/import/release)" = '7ab540aad1b283768d05a257c6d52b19e5bfb826'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-ff --no-edit refs/remotes/import/release
            git rm release-import.bundle
            git commit -m 'Remove source transport bundle after verified import'
            git push origin HEAD:main
          fi
          git merge-base --is-ancestor 7ab540aad1b283768d05a257c6d52b19e5bfb826 HEAD
      - run: node apps/robertn_waze_cluster/tools/test_control.js
      - run: sh apps/robertn_waze_cluster/tools/test_startup_node8.sh
      - run: node apps/robertn_waze_cluster/tools/test_page.js
      - run: node apps/robertn_waze_cluster/tools/test_design.js
      - run: node native/cluster-studio/test/test.js
      - run: node apps/robertn_waze_cluster/tools/test_studio.js
      - run: node apps/robertn_waze_cluster/tools/test_profiles.js
      - run: node apps/robertn_waze_cluster/tools/test_settings.js
      - run: node release/test/release_test.js
      - run: node release/release.js check robertn_waze_cluster
      - name: Publish tested installable artifacts and catalog
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
          MGU_PUBLISH_VISIBILITY: any
        run: node release/release.js publish robertn_waze_cluster
