name: Verify and publish HUD blank-frame repair
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.12.0
      - name: Import tested recovery source
        run: |
          set -eu
          if [ -f bmw-map-flicker-0117.bundle ]; then
            echo '4fdd262ea4eed50ec97c3666dbc0d71290d30833a3cc76f57b1226d624154709  bmw-map-flicker-0117.bundle' | sha256sum -c -
            git bundle verify bmw-map-flicker-0117.bundle
            git fetch ./bmw-map-flicker-0117.bundle refs/heads/shamo/native-assistance-window:refs/remotes/import/recovery
            test "$(git rev-parse refs/remotes/import/recovery)" = 'bcee21242142929e37ce51cbfb8376669751f951'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-ff --no-edit refs/remotes/import/recovery
            git rm bmw-map-flicker-0117.bundle
            git commit -m 'Remove tested HUD recovery source transport bundle'
            git push origin HEAD:main
          fi
          git merge-base --is-ancestor bcee21242142929e37ce51cbfb8376669751f951 HEAD
      - name: Verify renderer host integration
        run: make -C native/cluster-render test
      - name: Verify map tool and vehicle binary
        run: |
          make -C native/waze-on-cluster test
          make -C native/waze-on-cluster test-x86 target
      - name: Verify app, helper and factory preview
        run: |
          set -eu
          for test in native/cluster-studio/test/*.js apps/robertn_waze_cluster/tools/test_*.js; do
            node "$test"
          done
          node native/cluster-studio/test/factory-personal/test.js
          node native/cluster-studio/test/assistance-window/test.js
          sh apps/robertn_waze_cluster/tools/test_startup_node8.sh
          node release/test/release_test.js
      - name: Verify reproducible map-tool artifact
        run: node release/release.js check waze-on-cluster
      - name: Publish Waze on cluster 0.7.117
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
          MGU_PUBLISH_VISIBILITY: any
        run: node release/release.js publish waze-on-cluster
