name: Import and publish saved display recovery
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.12.0
      - name: Import tested display recovery source
        run: |
          if [ -f release-import.bundle ]; then
            echo '100a30480f85d3fedf9c6b3f51cf72a6d941e7e3b05ec3f4e0f02a7faf79f88d  release-import.bundle' | sha256sum -c -
            git bundle verify release-import.bundle
            git fetch ./release-import.bundle refs/heads/shamo/call-recovery:refs/remotes/import/release
            test "$(git rev-parse refs/remotes/import/release)" = 'f48e76f700c66e73b4bc47302c82b33de35b0970'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-ff --no-edit refs/remotes/import/release
            git rm release-import.bundle
            git commit -m 'Remove tested recovery source transport bundle'
            git push origin HEAD:main
          fi
          git merge-base --is-ancestor f48e76f700c66e73b4bc47302c82b33de35b0970 HEAD
      - name: Test all app controls, editing and startup
        run: |
          set -eu
          for test in apps/robertn_waze_cluster/tools/test_*.js; do
            node "$test"
          done
      - name: Test gauge continuity, data and visual parity
        run: |
          set -eu
          for test in test test_telemetry test_stability test_recovery test_polling test_frame_cache test_refresh test_panel_composition test_image_delta test_assistance live_values_test test_phone_design test_features; do
            node "native/cluster-studio/test/$test.js"
          done
          make -C native/cluster-render test
          node native/cluster-studio/test/test_renderer_integration.js
          node release/test/release_test.js
      - name: Test new runtime paths on Node 8
        run: |
          set -eu
          runtime_dir=$(mktemp -d)
          trap 'rm -rf "$runtime_dir"' EXIT
          curl --fail --silent --show-error --location --max-time 90 https://nodejs.org/download/release/v8.16.2/node-v8.16.2-linux-x64.tar.gz -o "$runtime_dir/node.tar.gz"
          printf '%s  %s\n' 722d07291a8886384388c6795a747ec2055073f83dc73c0a97efba0022cc23ff "$runtime_dir/node.tar.gz" | sha256sum -c -
          tar -xzf "$runtime_dir/node.tar.gz" -C "$runtime_dir"
          for test in test_stability test_recovery test_polling test_frame_cache test_refresh test_telemetry test_image_delta; do
            "$runtime_dir/node-v8.16.2-linux-x64/bin/node" "native/cluster-studio/test/$test.js"
          done
          for test in test_startup test_settings_startup test_design_lifecycle test_customization test_editor_live test_idrive test_canvas_line; do
            "$runtime_dir/node-v8.16.2-linux-x64/bin/node" "apps/robertn_waze_cluster/tools/$test.js"
          done
      - name: Verify reproducible app and helper artifacts
        run: node release/release.js check cluster-studio robertn_waze_cluster
      - name: Publish app 0.4.138 and helper 0.1.15
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
          MGU_PUBLISH_VISIBILITY: any
        run: node release/release.js publish cluster-studio robertn_waze_cluster
