name: Import and publish separate cluster and HUD resources
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.12.0
      - name: Import tested separate cluster and HUD resources source
        run: |
          set -eu
          if [ -f release-import.bundle ]; then
            echo 'c4918a1758da60e41dee16569fc19c09a2431d0bf9e2a49b33ddad72b860c021  release-import.bundle' | sha256sum -c -
            git bundle verify release-import.bundle
            git fetch ./release-import.bundle refs/heads/shamo/separate-cluster-hud:refs/remotes/import/release
            test "$(git rev-parse refs/remotes/import/release)" = '1662edcebe19c6d753477aa2ff96e96949f08788'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-ff --no-edit refs/remotes/import/release
            git rm release-import.bundle
            git commit -m 'Remove tested separate-display source transport bundle'
            git push origin HEAD:main
          fi
          git merge-base --is-ancestor 1662edcebe19c6d753477aa2ff96e96949f08788 HEAD
      - name: Test app controls and saved gauge behavior
        run: |
          set -eu
          for test in apps/robertn_waze_cluster/tools/test_*.js; do
            node "$test"
          done
          for test in test test_telemetry test_stability test_recovery test_polling test_frame_cache test_refresh test_panel_composition test_image_delta test_assistance live_values_test test_phone_design test_features; do
            node "native/cluster-studio/test/$test.js"
          done
      - name: Test renderer and map lifecycle
        run: |
          set -eu
          make -C native/cluster-render test
          make -C native/waze-on-cluster test
          node native/cluster-studio/test/test_renderer_integration.js
          node release/test/release_test.js
      - name: Test x86 renderer paths and build head-unit binaries
        run: make -C native/cluster-render test-x86 target
      - name: Verify reproducible renderer, app and helper artifacts
        run: node release/release.js check cluster-render cluster-studio robertn_waze_cluster
      - name: Publish renderer 0.3.104, helper 0.1.17 and app 0.4.140
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
          MGU_PUBLISH_VISIBILITY: any
        run: node release/release.js publish cluster-render cluster-studio robertn_waze_cluster
