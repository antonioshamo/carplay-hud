name: Import and publish HUD compatibility update
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.12.0
      - name: Import the reviewed source commit
        run: |
          if [ -f release-import.bundle ]; then
            echo '89b4435858ed04825e8dc125a7a970bf33f64175c8f85239472e0aad86c56b5c  release-import.bundle' | sha256sum -c -
            git bundle verify release-import.bundle
            git fetch ./release-import.bundle refs/heads/shamo/hud-settings-research:refs/remotes/import/release
            test "$(git rev-parse refs/remotes/import/release)" = '5d2598e58db656d4398c548f49bec8f98315eb6e'
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-ff --no-edit refs/remotes/import/release
            git rm release-import.bundle
            git commit -m 'Remove source transport bundle after verified import'
            git push origin HEAD:main
          fi
          git merge-base --is-ancestor 5d2598e58db656d4398c548f49bec8f98315eb6e HEAD
      - run: node native/hud-startup-diagnostics/test.js
      - run: node apps/robertn_waze_cluster/tools/test_trace.js
      - run: node apps/robertn_waze_cluster/tools/check_rhmi.js
      - run: node apps/robertn_waze_cluster/tools/test_page.js
      - run: node apps/robertn_waze_cluster/tools/test_design.js
      - name: Check the collector with Node 8 on Linux
        run: |
          set -eu
          runtime_dir=$(mktemp -d)
          trap 'rm -rf "$runtime_dir"' EXIT
          curl --fail --silent --show-error --location --max-time 90 https://nodejs.org/download/release/v8.16.2/node-v8.16.2-linux-x64.tar.gz -o "$runtime_dir/node.tar.gz"
          printf '%s  %s\n' 722d07291a8886384388c6795a747ec2055073f83dc73c0a97efba0022cc23ff "$runtime_dir/node.tar.gz" | sha256sum -c -
          tar -xzf "$runtime_dir/node.tar.gz" -C "$runtime_dir"
          "$runtime_dir/node-v8.16.2-linux-x64/bin/node" native/hud-startup-diagnostics/test.js
          "$runtime_dir/node-v8.16.2-linux-x64/bin/node" apps/robertn_waze_cluster/tools/check_rhmi.js
          "$runtime_dir/node-v8.16.2-linux-x64/bin/node" apps/robertn_waze_cluster/tools/test_trace.js
          "$runtime_dir/node-v8.16.2-linux-x64/bin/node" apps/robertn_waze_cluster/tools/test_startup.js
      - run: node release/test/release_test.js
      - run: node release/release.js check robertn_waze_cluster
      - name: Publish app RHMI compatibility update
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
          MGU_PUBLISH_VISIBILITY: any
        run: node release/release.js publish robertn_waze_cluster
